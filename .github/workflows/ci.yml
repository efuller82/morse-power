name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-guard:
    name: Bootstrap must be complete
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if the project is not initialized
        run: |
          if [ -f BOOTSTRAP.md ]; then
            echo "BOOTSTRAP.md still exists: this project has not been initialized." >&2
            echo "Run the bootstrap session before opening pull requests." >&2
            exit 1
          fi
          if grep -rn '{{' AGENTS.md SECURITY.md; then
            echo "Unfilled placeholders remain — bootstrap is incomplete." >&2
            exit 1
          fi

  gate:
    name: Project gate
    runs-on: ubuntu-latest
    needs: bootstrap-guard
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run the gate
        run: node --test
